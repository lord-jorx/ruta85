# Supabase gratis pausa el proyecto tras 7 días sin actividad: una consulta cada 3 días lo mantiene despierto.
# Usa solo la URL y la clave publishable (públicas). Postgres responde 401 "permission denied"
# (anon no tiene permisos en las tablas, a propósito): la consulta llega a la base y cuenta como actividad.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la API
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/settings?select=id&limit=1" -H "apikey: $KEY")
          echo "HTTP $code"
          [ "$code" = 200 ] || [ "$code" = 401 ]
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
