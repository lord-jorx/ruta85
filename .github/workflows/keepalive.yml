# Supabase gratis pausa el proyecto tras 7 días sin actividad: una consulta cada 3 días lo mantiene despierto.
# Usa solo la URL y la clave publishable (públicas); con RLS la respuesta es una lista vacía.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la API
        run: |
          curl -fsS "$URL/rest/v1/settings?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
